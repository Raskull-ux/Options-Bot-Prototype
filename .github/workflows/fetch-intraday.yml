name: Fetch intraday bars (trade review)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fetch_intraday_bars.py
      - .github/workflows/fetch-intraday.yml

permissions:
  contents: write

concurrency:
  group: discord-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull 5m / 15m / 1h bars
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python fetch_intraday_bars.py
      - name: Commit bars
        run: |
          git config user.name "options-bot"
          git config user.email "options-bot@users.noreply.github.com"
          git add data/intraday/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Intraday bars for trade review: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
