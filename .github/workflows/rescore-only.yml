name: Re-run signal engine only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rescore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run signal engine
        run: python signal_engine.py

      - name: Commit updated signal data
        run: |
          git config user.name "options-bot"
          git config user.email "options-bot@users.noreply.github.com"
          git add data/daily_signals.csv data/regime_state.csv data/signals.csv
          if git diff --cached --quiet; then
            echo "No signal data changes to commit."
          else
            git commit -m "Signal engine re-run: $(date -u +%Y-%m-%d)"
            git push
          fi
