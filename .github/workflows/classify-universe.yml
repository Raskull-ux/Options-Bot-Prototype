name: Classify universe (stocks vs ETFs)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch real security types (one Finnhub call)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python build_symbol_types.py

      - name: Diagnose universe composition
        run: python classify_universe_types.py

      - name: Commit symbol type cache
        run: |
          git config user.name "options-bot"
          git config user.email "options-bot@users.noreply.github.com"
          git add data/symbol_types.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Symbol type cache update: $(date -u +%Y-%m-%d)"
            git push
          fi
