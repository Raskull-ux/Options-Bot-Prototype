name: SEC earnings history

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 0"   # Sundays 13:00 UTC; ~5 minutes at SEC's rate limit

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build SEC earnings history
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python build_edgar_earnings.py
      - name: Commit
        run: |
          git config user.name "options-bot"
          git config user.email "options-bot@users.noreply.github.com"
          git add data/edgar_earnings.csv
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "SEC earnings history: $(date -u +%Y-%m-%d)"; git pull --rebase --autostash; git push; fi
