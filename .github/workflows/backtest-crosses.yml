name: Cross checker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check hourly/daily 20-50 and 10/10 crosses + QQQ 10-day gauge
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python backtest_crosses.py
      - name: Commit event list
        if: always()
        run: |
          git config user.name "options-bot"
          git config user.email "options-bot@users.noreply.github.com"
          git add data/cross_check_hourly_events.csv || true
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Cross checker: $(date -u +%Y-%m-%d)"; git pull --rebase --autostash; git push; fi
