name: Backtest SPY straddle v2 (Databento quotes)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "estimate = price the query only (free); diagnose = show why symbols fail (free); run = download and backtest"
        required: true
        default: "estimate"
      budget:
        description: "Max Databento spend in USD; run aborts if the estimate is higher"
        required: true
        default: "15"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backtest
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: python backtest_index_vol_db.py ${{ github.event.inputs.mode }} ${{ github.event.inputs.budget }}
      - name: Commit quote cache and results
        if: always()
        run: |
          git config user.name "options-bot"
          git config user.email "options-bot@users.noreply.github.com"
          git add data/db_spy_quotes.csv.gz data/backtest_index_vol_db_trades.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "SPY straddle v2: $(date -u +%Y-%m-%d)"; git pull --rebase --autostash; git push; fi
            
