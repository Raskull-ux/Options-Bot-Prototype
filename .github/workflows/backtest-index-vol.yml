name: Backtest SPY straddle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run SPY straddle backtest
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python backtest_index_vol.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "options-bot"
          git config user.email "options-bot@users.noreply.github.com"
          git add data/backtest_index_vol_trades.csv || true
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "SPY straddle backtest: $(date -u +%Y-%m-%d)"; git pull --rebase --autostash; git push; fi
